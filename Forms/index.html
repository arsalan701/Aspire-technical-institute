<!DOCTYPE html>
<html lang="en">
<head>
        <title>Form</title>
</head>
<body>
    <header><b>STUDENT REGISTRATION FORM</b></header>
    <table>
    <tr>
        <td><label for="first name">First Name</label></td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td><label for="last name">Last Name</label></td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td class="column"> <label for="dob">Date of Birth</label></td>
        <td class="dropdown list"><input type="date"></td>
    </tr>
    <tr>
        <td><label for="email">Email ID</label></td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td><label for="Number"></label>Mobile Number</td>
        <td><input type="number"></td>
    </tr>
    <tr>
        <td><label for="gender">Gender</label></td>

        <td><input type="radio" id="male" name="gender" value="male"></td>
        <td><label for="male">Male</label></td>

         <td><input type="radio" id="female" name="gender" value="female"></td>
        <td><label for="female">Female</label></td>
    </tr>

    <tr>
        <td><label for="address">Address</label></td>
        <td><input type="text" name="" id=""></td>
    </tr>
    <tr>
        <td><label for="city">City</label></td>
        <td><input type="text" name="" id="city"></td>
    </tr>
    <tr>
        <td><label for="pin code">Pin Code</label></td>
        <td><input type="text" name="" id="pin code"></td>
    </tr>
    <tr>
        <td><label for="country">Country</label></td>
        <td><input type="" name="" id="Country"></td>
    </tr>

    </table>
    
</body>
</html>
